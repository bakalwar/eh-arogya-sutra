<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Clearing Cache...</title>
<style>
  body { background: #080f09; color: #e8c46a; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; flex-direction: column; gap: 16px; margin: 0; }
  .msg { font-size: 1.2rem; }
  .sub { font-size: 0.85rem; color: #4a9b54; }
</style>
</head>
<body>
<div class="msg">🧹 Cache + Service Worker clear ho raha hai...</div>
<div class="sub" id="status">Please wait...</div>
<script>
(async () => {
  const st = document.getElementById('status');
  let done = [];

  // 1. Unregister all service workers
  if ('serviceWorker' in navigator) {
    const regs = await navigator.serviceWorker.getRegistrations();
    for (const r of regs) { await r.unregister(); done.push('SW unregistered'); }
  }

  // 2. Delete all caches
  if ('caches' in window) {
    const keys = await caches.keys();
    for (const k of keys) { await caches.delete(k); done.push('Cache: ' + k + ' deleted'); }
  }

  // 3. Clear localStorage & sessionStorage
  try { localStorage.clear(); sessionStorage.clear(); done.push('Storage cleared'); } catch(e) {}

  st.textContent = done.length ? done.join(' | ') : 'Already clean!';

  // 4. Redirect to login fresh
  setTimeout(() => { window.location.replace('/go-search.html?t=' + Date.now()); }, 1500);
})();
</script>
</body>
</html>
