<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Panel — Opening…</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #060d07;
      color: #e8c46a;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    h1 { font-size: 1.1rem; color: #fff; margin: 0; font-weight: 600; }
    #status { font-size: 0.85rem; color: rgba(255,255,255,0.5); max-width: 22rem; text-align: center; line-height: 1.5; }
    .err { color: #f87171; }
    .ok { color: #4a9b54; }
  </style>
</head>
<body>
  <div style="font-size:2.5rem">⚙️</div>
  <h1>E.H. Arogya — Admin Panel</h1>
  <p id="status">Cache clear + login ho raha hai…</p>
  <script>
    (async function () {
      const st = document.getElementById('status');
      function set(msg, cls) {
        st.textContent = msg;
        st.className = cls || '';
      }

      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          for (const r of regs) await r.unregister();
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          for (const k of keys) await caches.delete(k);
        }
        localStorage.removeItem('eh_token');
        localStorage.removeItem('eh_refresh');
        localStorage.removeItem('eh_user');
        sessionStorage.setItem('eh_splash_brand_v1', '1');
      } catch (e) {
        /* ignore */
      }

      set('Demo admin login…');
      try {
        const res = await fetch('/api/auth/dev-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: '{}'
        });
        const data = await res.json();
        if (!res.ok || !data.success) {
          set(data.message || 'Login fail — npm run dev chalao + npm run seed:postgres', 'err');
          return;
        }
        const token = data.accessToken || data.token;
        localStorage.setItem('eh_token', token);
        if (data.refreshToken) localStorage.setItem('eh_refresh', data.refreshToken);
        localStorage.setItem('eh_user', JSON.stringify(data.user));
        set('Admin Panel khul raha hai…', 'ok');
        window.location.replace('/admin?t=' + Date.now());
      } catch (e) {
        set('API nahi mila — pehle terminal mein: npm run dev', 'err');
      }
    })();
  </script>
</body>
</html>
