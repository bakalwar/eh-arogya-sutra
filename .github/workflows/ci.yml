name: EHAS2 CI

on:
  push:
    branches:
      - main
      - develop
      - master
      - hardening/full-repo-test-environment-audit
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ehas2
          POSTGRES_PASSWORD: ehas2_isolated_test_only
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U ehas2 -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --label ehas2.role=isolated-test-database
    env:
      EHAS2_NODE_ENV: test
      NODE_ENV: test
      EHAS2_ALLOW_DESTRUCTIVE_TEST_DB_RESET: 'true'
      EHAS2_TEST_PG_HOST: 127.0.0.1
      EHAS2_TEST_PG_PORT: '55432'
      EHAS2_TEST_PG_USER: ehas2
      EHAS2_TEST_PG_PASSWORD: ehas2_isolated_test_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create isolated test databases
        env:
          PGPASSWORD: ehas2_isolated_test_only
        run: |
          set -e
          for db in ehas2_phase3a_test ehas2_phase3b_test ehas2_phase3c_test ehas2_phase3d_test ehas2_phase4a_preflight ehas2_phase_evidence_test ehas2_phase_extract_test ehas2_phase_ocr_test ehas2_phase_f3c_test ehas2_phase_f3d_test ehas2_phase_f3d2d1_test; do
            psql -h 127.0.0.1 -p 55432 -U ehas2 -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = '${db}'" | grep -q 1 \
              || psql -h 127.0.0.1 -p 55432 -U ehas2 -d postgres -c "CREATE DATABASE ${db} OWNER ehas2;"
          done
      - name: Install (lockfile)
        run: npm ci
      - name: Install tesseract build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool pkg-config \
            libpng-dev libjpeg-dev libtiff-dev zlib1g-dev \
            libleptonica-dev curl git fonts-noto-core
      - name: Bootstrap extract tools
        run: npm run bootstrap:extract-tools
      - name: Export pinned Tesseract paths
        run: |
          echo "EHAS2_TESSERACT_BIN=${GITHUB_WORKSPACE}/packages/evidence-extract-adapters/.extract-tools/tesseract/bin/tesseract" >> "$GITHUB_ENV"
          echo "TESSDATA_PREFIX=${GITHUB_WORKSPACE}/packages/evidence-extract-adapters/.extract-tools" >> "$GITHUB_ENV"
          echo "EHAS2_DEVANAGARI_FONT=${GITHUB_WORKSPACE}/packages/evidence-extract-adapters/.extract-tools/fonts/NotoSansDevanagari-Regular.ttf" >> "$GITHUB_ENV"
      - name: Enforce mandatory OCR tests are not skipped or todo
        run: |
          set -e
          if grep -E '\b(skip|skipIf|todo)\b' tests/unit/f3b-adapter-pipeline.test.ts; then
            echo 'Mandatory F3B OCR tests must not be skipped or todo' >&2
            exit 1
          fi
      - name: Bootstrap clinical extract tools
        run: npm run bootstrap:clinical-extract
      - name: Boundary verification
        run: npm run verify:boundary
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm run test
      - name: Evidence ingest selector firewall (F1)
        run: |
          set -e
          if grep -R -E '@ehas2/rule[1-9]|tesseract|pdf-parse' packages/evidence-ingest/src --exclude=types.ts packages/database/src/services/evidenceService.ts packages/database/src/repositories/evidence.ts apps/api/src/routes/evidence.ts apps/api/src/http/streamBody.ts apps/api/src/middleware/uploadLimits.ts apps/worker/src packages/observability/src/evidenceMetrics.ts; then
            echo 'Forbidden selector/OCR/engine coupling in evidence ingest paths' >&2
            exit 1
          fi
      - name: F3A extraction candidate selector firewall
        run: |
          set -e
          if grep -R -E '@ehas2/rule[1-9]|tesseract|pdf-parse|pdfjs|analyzeComplete|LibreTranslate' \
            packages/evidence-extract/src --exclude=types.ts --exclude=factCandidateTypes.ts --exclude=factNormalizationTypes.ts --exclude-dir=terminology \
            packages/database/src/repositories/extraction.ts \
            apps/worker/src/jobs/extractCandidates.ts; then
            echo 'Forbidden OCR/engine coupling in F3A extraction paths' >&2
            exit 1
          fi
      - name: F3B adapters selector firewall
        run: |
          set -e
          if grep -R -E '@ehas2/rule[1-9]|tesseract\.js|pdf-parse|analyzeComplete|LibreTranslate|evaluateRule[1-9]' \
            packages/evidence-extract-adapters/src; then
            echo 'Forbidden selector/engine coupling in F3B adapters package' >&2
            exit 1
          fi
      - name: F3C candidate review selector firewall
        run: |
          set -e
          if grep -R -E '@ehas2/rule[1-9]|tesseract\.js|pdf-parse|analyzeComplete|LibreTranslate|evaluateRule[1-9]|clinically_used\s*=\s*true' \
            packages/database/src/repositories/candidateReview.ts \
            packages/database/src/services/evidenceService.ts \
            packages/evidence-extract/src/reviewPresentation.ts \
            packages/evidence-extract/src/flags.ts \
            apps/api/src/routes/evidence.ts \
            apps/web/src/app/preview/candidate-review \
            apps/web/src/components/preview/CandidateSourceLocatorView.tsx \
            apps/web/src/components/preview/CandidateReviewLocalBoard.tsx \
            apps/web/src/lib/preview/candidateReviewFixtures.ts; then
            echo 'Forbidden selector/engine coupling in F3C candidate review paths' >&2
            exit 1
          fi
      - name: F3D fact-candidate selector firewall
        run: |
          set -e
          F3D_PATHS="packages/database/src/repositories/factCandidate.ts packages/database/src/services/factCandidateService.ts packages/evidence-extract/src/factCandidateTypes.ts packages/evidence-extract/src/flags.ts apps/api/src/routes/factCandidates.ts"
          # Coupling: imports, invocations, writes. Do not match deny-list field-name literals.
          if grep -R -E '@ehas2/rule[1-9]|@ehas2/medicine-registry|@ehas2/engine-adapter|evaluateRule[1-9]|tesseract\.js|pdf-parse|LibreTranslate|addStructuredFindings|CORRECTED_BY_DOCTOR|clinically_used[[:space:]]*=[[:space:]]*true|clinically_used[[:space:]]*:[[:space:]]*true' \
            $F3D_PATHS; then
            echo 'Forbidden selector/engine coupling in F3D fact-candidate paths' >&2
            exit 1
          fi
          if grep -R -E -i 'import[[:space:]].*analyzeComplete|import[[:space:]]*\([^)]*analyzeComplete|require[[:space:]]*\([^)]*analyzeComplete|from[[:space:]].*analyzeComplete|analyzeComplete[[:space:]]*\(' \
            $F3D_PATHS; then
            echo 'Forbidden AnalyzeComplete import/invocation in F3D fact-candidate paths' >&2
            exit 1
          fi
          if ! grep -A30 'export const FACT_SELECTOR_FORBIDDEN_FIELD_NAMES' packages/evidence-extract/src/factCandidateTypes.ts | grep -F "'analyzeComplete'"; then
            echo 'F3D deny-list must keep analyzeComplete as a forbidden field name' >&2
            exit 1
          fi
          if grep -E 'structured_report_findings|addStructuredFindings' \
            packages/database/src/repositories/factCandidate.ts \
            packages/database/src/services/factCandidateService.ts; then
            echo 'F3D-1 must not write structured_report_findings' >&2
            exit 1
          fi
      - name: F3D-2 terminology-pack selector firewall
        run: |
          set -e
          node scripts/f3d2-terminology-firewall.mjs
          if grep -R -E 'structured_report_findings' packages/database/src/migrate.ts; then
            echo 'F3D-2D1 must not add findings writes to migrate.ts' >&2
            exit 1
          fi
          if [ ! -e packages/database/migrations/016_f3d2_fact_normalizations.sql ] || [ ! -e packages/database/migrations/016_f3d2_fact_normalizations.down.sql ]; then
            echo 'F3D-2D1 requires migration 016_f3d2_fact_normalizations' >&2
            exit 1
          fi
      - name: F3D-2D1 fact-normalization persistence firewall
        run: |
          set -e
          F3D2D1_PATHS="packages/database/src/repositories/factNormalization.ts packages/evidence-extract/src/factNormalizationTypes.ts packages/database/migrations/016_f3d2_fact_normalizations.sql"
          if grep -R -E '@ehas2/rule[1-9]|@ehas2/medicine-registry|@ehas2/engine-adapter|@ehas2/clinical-engine|evaluateRule[1-9]|tesseract\.js|pdf-parse|LibreTranslate|addStructuredFindings|parseOwnerFrozenCues|FactNormalizationService|ON DELETE CASCADE' \
            $F3D2D1_PATHS; then
            echo 'Forbidden coupling or CASCADE in F3D-2D1 persistence paths' >&2
            exit 1
          fi
          if grep -E -i 'import[[:space:]].*analyzeComplete|analyzeComplete[[:space:]]*\(' $F3D2D1_PATHS; then
            echo 'Forbidden AnalyzeComplete coupling in F3D-2D1 persistence paths' >&2
            exit 1
          fi
          if grep -E 'UPDATE clinical_fact_candidates|INSERT INTO clinical_fact_candidates' \
            packages/database/src/repositories/factNormalization.ts; then
            echo 'F3D-2D1 must not mutate parent clinical_fact_candidates' >&2
            exit 1
          fi
          if ! grep -E 'clinical_fact_normalizations_parent_link_fk|clinical_fact_candidates_016_norm_parent_uq' \
            packages/database/migrations/016_f3d2_fact_normalizations.sql; then
            echo 'F3D-2D1 requires composite parent binding FK/index' >&2
            exit 1
          fi
          if awk '/export type InsertFactNormalizationInput/,/^};/' \
            packages/database/src/repositories/factNormalization.ts \
            | grep -E '\b(patientId|consultationId|sourceChannel|sourceField|sourceIdentityFingerprint)\b'; then
            echo 'F3D-2D1 insert input must not accept caller-supplied parent linkage fields' >&2
            exit 1
          fi
          if ! grep -F 'FACT_INELIGIBLE' packages/database/src/repositories/factNormalization.ts; then
            echo 'F3D-2D1 insert must fail closed on ineligible parents' >&2
            exit 1
          fi
          if grep -E 'object_key|storage_path|https?://|password|api_key' \
            packages/database/migrations/016_f3d2_fact_normalizations.sql \
            packages/database/src/repositories/factNormalization.ts; then
            echo 'F3D-2D1 must not persist storage/credentials/PHI keys' >&2
            exit 1
          fi
          if ! grep -F "supersedeRuns" packages/database/src/repositories/extraction.ts >/dev/null; then
            echo 'expected supersedeRuns to remain in extraction repository' >&2
            exit 1
          fi
          if grep -E 'clinical_fact_normalizations|supersedeActiveLinkedToFacts|factNormalization' \
            packages/database/src/repositories/extraction.ts; then
            echo 'F3D-2D1 must not wire normalization lifecycle into #125 supersedeRuns yet' >&2
            exit 1
          fi
      - name: F3D-2B H2 runtime parser import firewall
        run: node scripts/ehas2-parser-runtime-import-firewall.mjs
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/clinical-engine/requirements.txt
      - name: Install clinical-engine dependencies
        run: python -m pip install --disable-pip-version-check -r apps/clinical-engine/requirements.txt
      - name: Test clinical engine
        run: npm run test:clinical-engine
      - name: Production build
        run: npm run build
      - name: Dependency audit (fail on high+ in production deps)
        run: npm audit --omit=dev --audit-level=high
      - name: Full audit report (informational)
        run: npm audit --json > dependency-audit.json || true
      - name: Preserve audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ehas2-quality-reports
          path: |
            dependency-audit.json
          if-no-files-found: ignore

  # Planned (not yet enforced as fail gate in Phase 1A-H):
  # - dedicated secret-scan action (gitleaks / trufflehog)
  # - patient-data heuristic scan beyond verify:boundary
  # Do not configure deployment or cloud credentials in this workflow.
